
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Météo</h1>
      <p>Consultez la météo de votre ville</p>

      <form id="form-recherche">
        <label for="ville">Choisir une ville :</label>

        <input type="text" id="ville" placeholder="Entrez le nom d'une ville" />

        <button type="submit">Rechercher</button>
      </form>

      <p id="message"></p>

      <section id="resultats">
        <!-- Les informations météo seront affichées ici -->
         <p id="chargement"hidden>chargement</p>
      </section>
    </main>
  </body>
</html>
